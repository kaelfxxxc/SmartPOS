<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142d4e" />
    <title>SmartPOS is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#142d4e;font-family:system-ui,sans-serif}main{width:min(100%,420px);padding:32px;text-align:center;background:white;border:1px solid #e4e9ef;border-radius:20px;box-shadow:0 18px 50px rgba(20,45,78,.1)}img{width:88px;height:88px;border-radius:20px}h1{margin:20px 0 10px;font-size:1.7rem}p{margin:0 0 22px;color:#627083;line-height:1.6}button{border:0;border-radius:10px;padding:12px 20px;background:#0a8064;color:white;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <img src="./brand/smart-pos-icon-192.png" alt="SmartPOS" />
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then try opening SmartPOS again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
